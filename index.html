function jump(){const id=+document.getElementById('jump').value;if(!Number.isInteger(id)||id<1||id>500){toast('请输入1至500的题号');return}if(state.session&&state.session.index<state.session.ids.length&&!confirm('查看指定题会替换当前一轮，已提交记录保留。继续？'))return;state.session={ids:[id],index:0,results:[],mode:'lookup'};choice=null;save();render();showContent()}
function showContent(){document.getElementById('content').scrollIntoView({behavior:'auto',block:'start'})}
function render(){let s=state.session;if(!s)return showHome();if(s.index>=s.ids.length)return finish();const q=BANK[s.ids[s.index]-1],r=s.results.find(r=>r.id===q.id);const confirmed=!!r;document.getElementById('content').innerHTML=stats()+`<div class="row" style="justify-content:space-between"><span class="kicker">本轮 ${s.index+1} / ${s.ids.length} · 原题 ${q.id}</span><span class="kicker">PDF 第 ${q.pages.join('、')} 页</span></div><progress value="${s.index}" max="${s.ids.length}" aria-label="本轮进度"></progress><h2 class="question">${esc(q.stem)}</h2>${q.flags.length?`<div class="flag">${q.answer?'原文提示':'待核对 · 不计分'}：${q.flags.map(esc).join('<br>')}</div>`:''}<div class="images">${q.images.map((img,i)=>`<img src="${img}" onerror="imageFailed(this)" data-pages="${q.pages.join('、')}" alt="第${q.id}题原始配图${i+1}，点击放大" tabindex="0" onclick="zoom(this.src)" onkeydown="if(event.key==='Enter')zoom(this.src)">`).join('')}</div><div class="stack">${q.options.map(o=>`<button class="option ${choice===o.key?'selected':''} ${confirmed&&q.answer===o.key?'correct':''} ${confirmed&&r.choice===o.key&&!r.correct?'wrong':''}" aria-pressed="${choice===o.key}" ${confirmed?'disabled':''} onclick="select('${o.key}')"><b>${o.key}</b><span>${esc(o.text)}</span></button>`).join('')}</div><div id="feedback" aria-live="polite">${confirmed?feedback(q,r):''}</div>${!q.answer?`<details class="source"><summary>查看原题与来源答案（待核对）</summary>${q.source.map(img=>`<img src="${img}" loading="lazy" onerror="imageFailed(this)" data-pages="${q.pages.join('、')}" alt="第${q.id}题原貌截图">`).join('')||'<p>原文未提供此题。</p>'}<p>${esc(q.rawAnswer)}</p></details>`:''}<div class="actions"><button onclick="skip()">${confirmed?'下一题':'暂时跳过'}</button>${q.answer?`<button class="primary" id="submit" onclick="submit()" ${confirmed||!choice?'disabled':''}>${confirmed?'已提交':'提交答案'}</button>`:'<span class="muted small">待核对题不计入正确率</span>'}</div>`;sidebar()}
function imageFailed(img){img.onerror=null;img.hidden=true;img.style.display='none';var p=document.createElement('p');p.className='flag';p.textContent='图片未加载成功，请联网重试；答题前可核对原 PDF 第'+img.getAttribute('data-pages')+'页。 ';var a=document.createElement('a');a.href='原题库.pdf';a.target='_blank';a.rel='noopener';a.textContent='打开原 PDF';p.appendChild(a);img.parentNode.insertBefore(p,img.nextSibling);}
function zoom(src){const d=document.getElementById('zoom');d.querySelector('img').src=src;d.showModal()}
function select(k){choice=k;render()}
function feedback(q,r){const label=q.options.find(o=>o.key===q.answer);return `<div class="feedback"><h3>${r.correct?'✓ 答对了':'✕ 本题答错，已加入待攻克'}</h3><p>来源标准答案：<b>${esc(q.answer)} · ${esc((label?label.text:''))}</b></p><p class="small">${esc(q.rawAnswer)}</p><p class="small muted">${/[（(]|解析/.test(q.rawAnswer)?'以上括号或解析内容来自原 PDF，未按2026法规独立核验。':'原 PDF 未提供详细解析；此处仅核对来源答案，不编造原因。'}</p>${r.correct&&['wrong','past'].includes(state.session.mode)&&!state.pending.includes(q.id)&&state.history.some(h=>h.id===q.id&&!h.correct)?'<p class="small">已从待攻克移除，历史记录保留。</p>':''}</div><details class="source"><summary>展开原题原貌核对（含答案）</summary>${q.source.map(img=>`<img src="${img}" loading="lazy" onerror="imageFailed(this)" data-pages="${q.pages.join('、')}" alt="第${q.id}题原貌截图">`).join('')}</details>`}
function applyAnswer(s,q,k){if(!q.answer||!q.options.some(o=>o.key===k))throw Error('不可判分');const correct=k===q.answer;const r={id:q.id,choice:k,correct,at:new Date().toISOString()};s.history.push(r);if(correct&&['wrong','past'].includes(s.session.mode))s.pending=s.pending.filter(id=>id!==q.id);else if(!correct&&!s.pending.includes(q.id))s.pending.push(q.id);s.session.results.push(r);if(s.session.mode==='sequence')s.cursor=q.id===500?1:q.id+1;return r}
function submit(){const s=state.session,q=BANK[s.ids[s.index]-1];if(!choice||s.results.some(r=>r.id===q.id))return;const result=applyAnswer(state,q,choice);if(result.correct)return skip();save();render()}
function skip(){state.session.index++;choice=null;save();render();showContent()}
function finish(){const s=state.session,n=s.results.length,c=s.results.filter(r=>r.correct).length;document.getElementById('content').innerHTML=stats()+`<h2>本轮练习结束</h2><p style="font-size:23px">已提交 ${n} 题 · 答对 ${c} 题</p><p class="muted">本轮正确率 ${n?Math.round(c/n*100)+'%':'—'}。跳过与待核对题不计分。错题可在“待攻克错题”中重做。</p><button class="primary" onclick="start()">再练一轮</button>`;sidebar()}
function exportData(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='科目一进度-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function importData(e){const f=e.target.files[0];if(!f)return;try{if(f.size>20000000)throw Error('文件过大');const s=JSON.parse(await f.text());if(!valid(s))throw Error('备份格式或题库版本不匹配');if(!confirm('导入将替换此浏览器的现有进度。建议先导出当前进度。继续导入？'))return;state=s;choice=null;save();showHome();toast('进度已导入')}catch(err){toast('无法导入：'+err.message)}finally{e.target.value=''}}
function showVersions(){document.getElementById('content').innerHTML=`<div class="versions"><h2>题库来源与法规版本</h2><p><b>来源：</b>用户提供《2026科目一精选500题.pdf》，72页；第1页标题“科目一精选500题（2025版）”。本应用保留来源题干、选项、答案及148幅配图，提供原貌截图。</p><p><b>完整性：</b>PDF从第176题直接跳到178题，只有499道实题。第177题保留缺题占位。11题含²异常字形，已标待核对，不猜题意、不判分。380、381、396、462答案提取为î，按原PDF图像核验为×。</p><p><b>2026现行法规核验状态：未逐题核验。</b>来源答案和原书解析只表示这份题库内容，不能据文件名认定为2026现行答案。记分、处罚、驾驶证业务等可能变化，请以考试所在地交管部门当前公告为准。</p><p>官方法规核对入口：<a target="_blank" rel="noopener" href="https://www.beijing.gov.cn/zhengce/zhengcefagui/qtwj/202412/t20241231_3978134.html">公安部172号令（2025年1月1日起施行）</a>、<a target="_blank" rel="noopener" href="https://jtgl.beijing.gov.cn/jgj/jgxx/flfg/gabgz/11186803/index.html">公安部163号令</a>。这些入口不代表覆盖2026全部法规变更。</p><p><a href="原题库.pdf" target="_blank">打开完整原 PDF</a></p><p class="small muted">保存位置：当前设备的浏览器。手机与电脑进度不会自动同步；换设备时先导出备份，再在另一设备导入。首次打开网页需要网络；本页没有离线缓存保障。清理浏览器数据或隐私模式可能丢失进度。历史记录不因错题练对而删除。</p><button onclick="showHome()">返回练习</button></div>`;showContent()}
showHome();window.practiceReady();sidebar();
</script></html>
